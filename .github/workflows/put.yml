name: progress-put

# 写入入口：前端 POST /api/put 触发 repository_dispatch
# 用 workflow_dispatch 也可直接调用
# 冲突策略：以时间戳 _t 较新者为准，并发提交不互盖

on:
  repository_dispatch:
    types: [progress-update]
  workflow_dispatch:
    inputs:
      payload:
        description: 'Base64 编码的进度 JSON'
        required: false

jobs:
  put:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 解码 payload
        env:
          TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "API_TOKEN 已配置 ✓"
          else
            echo "::notice::未配置 API_TOKEN secret，跳过令牌校验"
          fi
          # 兼容两种触发方式
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "${{ github.event.inputs.payload }}" | base64 -d > /tmp/payload.json 2>/dev/null || echo '{}' > /tmp/payload.json
          else
            echo "${{ github.event.client_payload.payload }}" | base64 -d > /tmp/payload.json
          fi
          echo "size: $(wc -c < /tmp/payload.json) bytes"

      - name: 合并并提交
        env:
          GIT_AUTHOR: ${{ github.actor }}
        run: |
          set -e
          mkdir -p data
          F="data/progress.json"

          python3 - <<'PY'
          import json, os
          f = "data/progress.json"
          try:
              new = json.load(open("/tmp/payload.json", encoding="utf-8"))
          except Exception:
              new = {}

          def merge(local, remote):
              if not isinstance(remote, dict): return remote
              if not isinstance(local, dict): return dict(remote)
              out = dict(local)
              for k, v in remote.items():
                  if k == "_t":
                      out["_t"] = max(local.get("_t", 0), v)
                  elif isinstance(v, dict) and isinstance(local.get(k), dict):
                      out[k] = merge(local[k], v)
                  else:
                      out[k] = v
              return out

          cur = {}
          if os.path.exists(f):
              try: cur = json.load(open(f, encoding="utf-8"))
              except Exception: cur = {}
          for key in ("checks", "notes", "edits"):
              if key in new and isinstance(new[key], dict):
                  cur[key] = merge(cur.get(key, {}), new[key])
          cur["_version"] = (cur.get("_version", 0) + 1)
          cur["_updated_at"] = os.environ.get("GIT_AUTHOR", "unknown")
          json.dump(cur, open(f, "w", encoding="utf-8"), ensure_ascii=False, indent=1, sort_keys=True)
          print("merged -> version", cur["_version"])
          PY

          git config user.name "kaogong-bot"
          git config user.email "kaogong-bot@users.noreply.github.com"
          git add data/progress.json
          git diff --cached --quiet || git commit -m "sync: merge progress v$(python3 -c 'import json;print(json.load(open("data/progress.json"))["_version"])') [skip ci]"
          git push

      - name: 返回成功
        run: echo "::notice::progress updated, version ${{ github.run_number }}"
