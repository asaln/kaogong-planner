name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 确保 data/progress.json 存在
        run: |
          mkdir -p data
          if [ ! -f data/progress.json ]; then
            echo '{"_version":0,"checks":{},"notes":{},"edits":{},"_updated_at":"init"}' > data/progress.json
          fi

      - name: 打包站点产物
        run: |
          mkdir -p _site
          cp index.html style.css data.js app.js README.md _site/
          cp -r data _site/data
          cp index.html _site/404.html
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
